<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- SEO. Crawlers don't run JavaScript, so update these values by hand (see README). -->
  <title>Your Name</title>
  <meta name="description" content="Everywhere I am online, in one place.">
  <meta name="theme-color" content="#110d0a">
  <link rel="canonical" href="https://your-site.netlify.app/">

  <!-- Open Graph / social sharing -->
  <meta property="og:type" content="profile">
  <meta property="og:site_name" content="Your Name">
  <meta property="og:title" content="Your Name">
  <meta property="og:description" content="Everywhere I am online, in one place.">
  <meta property="og:url" content="https://your-site.netlify.app/">
  <meta property="og:image" content="https://your-site.netlify.app/images/avatar.svg">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Favicon -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <!-- Fonts: Bodoni Moda for the name, Manrope for everything else -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Manrope:wght@300;400;600&display=swap">

  <link rel="stylesheet" href="css/style.css">
  <!-- Order matters: config first, then the renderer -->
  <script src="js/config.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <img id="bg" alt="" decoding="async" fetchpriority="high">
  </div>
  <div class="veil" aria-hidden="true"></div>

  <main class="card">
    <img id="avatar" class="avatar" width="112" height="112" alt="">
    <h1 id="name" class="name"></h1>
    <div id="bio" class="bio"></div>
    <nav id="links" class="links" aria-label="Social and personal links"></nav>
  </main>

  <footer id="foot" class="foot"></footer>
</body>
</html>
