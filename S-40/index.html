<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <base href="../">
  <title>لوحة التحكم</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/admin.css">
  <script src="js/config.js"></script>
  <script src="js/admin.js" defer></script>
</head>
<body>
<main class="wrap">
  <header class="top">
    <h1>لوحة التحكم</h1>
    <a href="s-01/" target="_blank" rel="noopener">عرض الموقع</a>
  </header>

  <section class="panel">
    <h2>الاتصال بـ GitHub</h2>
    <p class="hint">أدخل رمز الوصول الذي أنشأته. يُحفظ على هذا الجهاز فقط إذا فعّلت خيار التذكر.</p>
    <input id="token" type="password" placeholder="github_pat_..." autocomplete="off">
    <label class="check"><input id="remember" type="checkbox"> تذكّر الرمز على هذا الجهاز</label>
  </section>

  <section class="panel">
    <h2>المعلومات الشخصية</h2>
    <label>الاسم<input id="name"></label>
    <label>النبذة<textarea id="bio" rows="4"></textarea></label>
    <label>النص أسفل الصفحة<input id="footer"></label>
    <label>لغة الصفحة
      <select id="lang">
        <option value="en">English</option>
        <option value="ar">العربية</option>
      </select>
    </label>
  </section>

  <section class="panel">
    <h2>الصور</h2>
    <div class="img-field">
      <label>الصورة الشخصية (المسار)<input id="avatar"></label>
      <input id="avatar-file" type="file" accept="image/*">
    </div>
    <div class="img-field">
      <label>الخلفية (المسار)<input id="background"></label>
      <input id="background-file" type="file" accept="image/*">
    </div>
    <p class="hint">الحد الأقصى لحجم الصورة 900KB. إذا كانت أكبر، صغّرها من squoosh.app.</p>
  </section>

  <section class="panel">
    <h2>حسابات التواصل</h2>
    <div id="social-list" class="list"></div>
    <button id="add-social" type="button">إضافة حساب</button>
  </section>

  <section class="panel">
    <h2>روابط إضافية</h2>
    <div id="extra-list" class="list"></div>
    <button id="add-extra" type="button">إضافة رابط</button>
  </section>
</main>

<div class="actions">
  <button id="save" type="button" class="primary">حفظ ونشر التعديلات</button>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
